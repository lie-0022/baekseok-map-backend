spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: DBURL
    username: ID
    password: PASSWD

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

jwt:
  secret: 'JWTSECRET'